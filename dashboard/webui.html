<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>BeamMP Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
<style nonce="__NONCE__">
:root{
  --bg:#f4f4f2;--surface:#fcfcfb;--surface-2:#f0efec;--line:#e2e1dc;--line-strong:#cfcec8;
  --text:#0b0b0b;--text-2:#52514e;--muted:#7a7974;
  --accent:#2a78d6;--accent-ink:#ffffff;--accent-soft:#e3eefb;
  --good:#0ca30c;--warning:#fab219;--serious:#ec835a;--critical:#d03b3b;
  --good-ink:#006300;--warn-ink:#8a5a00;--crit-ink:#b42323;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --r:12px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --heat-0:#cde2fb;--heat-1:#9ec5f4;--heat-2:#6da7ec;--heat-3:#3987e5;--heat-4:#256abf;--heat-5:#184f95;--heat-6:#0d366b;
}
html[data-theme=dark]{
  --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2e2e2b;--line-strong:#3c3c38;
  --text:#f0efec;--text-2:#c3c2b7;--muted:#8e8d86;
  --accent:#3987e5;--accent-ink:#ffffff;--accent-soft:#1b2c42;
  --good-ink:#4cc94c;--warn-ink:#f6c344;--crit-ink:#f07070;
  --shadow:none;
  --heat-0:#0d366b;--heat-1:#104281;--heat-2:#184f95;--heat-3:#256abf;--heat-4:#3987e5;--heat-5:#6da7ec;--heat-6:#9ec5f4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.app>div{min-width:0}
.card.tight{overflow-x:auto}
.heat{min-width:0}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:650;letter-spacing:-.01em}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:15px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nav{all:unset;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text-2);cursor:pointer;position:relative}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.active{background:var(--accent-soft);color:var(--text);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--critical);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:600}
.side .grow{flex:1}
.side .foot{display:flex;gap:6px;padding:8px 4px 0;border-top:1px solid var(--line);margin-top:8px}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:15px;margin:0 0 12px;letter-spacing:-.005em}
.sub{color:var(--text-2);margin:0 0 22px}
.grid{display:grid;gap:16px}
.srvpick{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;padding:0 4px}.srvpick select{width:100%}
.mobilebar .srvpick{margin:0;padding:0 4px;flex-direction:row;align-items:center;flex:0 0 auto}.mobilebar .srvpick span{display:none}.mobilebar .srvpick select{width:auto;min-width:130px;max-width:170px;padding:6px 8px}
.lim{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:520px){.lim{grid-template-columns:1fr}}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.tight{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}.small{font-size:12.5px}.mono{font-family:var(--mono);font-size:12.5px}
/* stat tiles */
.stat .label{color:var(--text-2);font-size:12.5px;margin-bottom:6px}
.stat .value{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .note{color:var(--muted);font-size:12.5px;margin-top:4px}
/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.good .dot{background:var(--good)}.pill.good{color:var(--good-ink)}
.pill.warn .dot{background:var(--warning)}.pill.warn{color:var(--warn-ink)}
.pill.bad .dot{background:var(--critical)}.pill.bad{color:var(--crit-ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--text-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit-ink)}.btn.danger:hover{border-color:var(--critical)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.iconbtn{all:unset;cursor:pointer;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--text-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn svg{width:18px;height:18px}
/* forms */
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-weight:550;margin-bottom:5px}
label.f>small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
input[type=text],input[type=password],input[type=number],input[type=email],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{font-family:var(--mono);font-size:13px;line-height:1.55;min-height:420px;resize:vertical;tab-size:4}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.toggle:last-child{border-bottom:0}
.toggle input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line-strong);position:relative;flex:none;cursor:pointer;margin:1px 0 0;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--accent)}.toggle input:checked::after{transform:translateX(16px)}
.toggle b{display:block;font-weight:550}.toggle small{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{all:unset;padding:6px 12px;cursor:pointer;color:var(--text-2);font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--text);font-weight:600}
/* lists & tables */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--text-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.issue{display:flex;gap:10px;padding:9px 12px;border-radius:8px;background:var(--surface-2);margin-bottom:6px;font-size:13.5px}
.issue .ic{flex:none;font-weight:700;width:18px;text-align:center}
.issue.error .ic{color:var(--crit-ink)}.issue.warning .ic{color:var(--warn-ink)}.issue.info .ic{color:var(--accent)}
.issue .ln{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:16px}
.secbar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:flex-start;padding:12px 16px;margin:0 0 16px;border-radius:10px;background:var(--critical);color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.secbar b{display:block}.secbar .small{opacity:.92;white-space:pre-wrap}.secbar .btn{background:#fff;color:#8b1a1a;border-color:#fff;flex:none}
.banner.warn{border-color:var(--warning)}.banner.bad{border-color:var(--critical)}.banner.info{border-color:var(--accent)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;background:var(--surface-2);color:var(--text-2);margin-left:6px;vertical-align:1px}
.badge.good{color:var(--good-ink)}.badge.warn{color:var(--warn-ink)}.badge.bad{color:var(--crit-ink)}
/* drop zone */
.drop{border:2px dashed var(--line-strong);border-radius:var(--r);padding:34px 16px;text-align:center;cursor:pointer;background:var(--surface);transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--accent)}
/* logs */
.log{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--surface-2);border-radius:10px;padding:12px 14px;height:520px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .e{color:var(--crit-ink)}.log .w{color:var(--warn-ink)}
/* checks */
.check{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .mark{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:1px}
.mark.ok{background:var(--good)}.mark.bad{background:var(--critical)}.mark.warn{background:var(--warning);color:#3a2a00}.mark.info{background:var(--accent)}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis text{fill:var(--muted);font-size:11px}
.chart .grid line{stroke:var(--line)}
.chart .bars rect{fill:var(--accent)}
.chart .bars rect.hit{fill:transparent}
.chart .bars rect.dim{opacity:.35}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--surface);border-radius:8px;padding:6px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;align-items:center}
.heat .c{aspect-ratio:1/1;border-radius:3px;background:var(--surface-2);position:relative}
.heat .lab{font-size:11px;color:var(--muted);text-align:center}
.heat .rl{text-align:left}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{width:18px;height:10px;border-radius:2px;display:inline-block}
/* notifications */
.notif{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}
.notif.unread{background:var(--accent-soft)}
.notif .lv{width:4px;border-radius:2px;flex:none;background:var(--accent)}
.notif .lv.error{background:var(--critical)}.notif .lv.warning{background:var(--warning)}.notif .lv.success{background:var(--good)}
/* auth screens */
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.authcard{width:100%;max-width:380px}
.authcard .logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:22px;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;z-index:50;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.secret{font-family:var(--mono);font-size:16px;letter-spacing:.06em;background:var(--surface-2);padding:10px 12px;border-radius:8px;text-align:center;user-select:all}
.mobilebar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobilebar{display:flex;position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;gap:2px;padding:6px}
  .mobilebar .nav{padding:7px 10px;white-space:nowrap}
  .mobilebar .nav svg{display:none}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
  main{padding:18px 14px 50px}
}
@media (max-width:520px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.stat .value{font-size:22px}}
</style>

const icon = n => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${I[n]}</svg>`;
const TABS = [["overview","Overview"],["servers","Servers"],["config","Config"],["mods","Mods"],["players","Players"],["network","Network"],["updates","Updates"],["logs","Logs"],["notifications","Notifications"],["settings","Settings"]];

/* ------------------------------------------------------------------ boot / auth */
async function boot() {
  clearInterval(TIMER);
  try { SESSION = await api("/api/session"); } catch (e) { $("#root").innerHTML = `<div class="center"><div class="card authcard"><h2>Can't reach the dashboard</h2><p class="muted">${esc(e.message)}</p></div></div>`; return; }
  CSRF = SESSION.csrf;
  if (SESSION.needs_setup) return renderSetup();
  if (!SESSION.logged_in) return renderLogin();
  try { SERVERS = (await api("/api/servers")).servers; } catch (e) { SERVERS = [{ id: "main", name: "Main server" }]; }
  if (!SERVERS.some(x => x.id === SERVER)) SERVER = "main";
  store.set("es-server", SERVER);
  renderShell();
  const hash = location.hash.slice(1);
  if (/^ack=[a-f0-9]{16}$/.test(hash)) { history.replaceState(null, "", location.pathname + "#overview"); await stopAlerts(hash.slice(4)); return show("overview"); }
  if (hash.startsWith("approve=")) { let n = ""; try { n = decodeURIComponent(hash.slice(8)).slice(0, 40); } catch (e) {} return approveFromLink(n); }
  show(TABS.some(t => t[0] === hash) ? hash : "overview");
}

async function approveFromLink(name) {
  const srv = SERVERS.find(x => x.id === SERVER) || {};
  history.replaceState(null, "", location.pathname + "#config");
  if (name && confirm("Let " + name + " join " + (srv.name || "this server") + "?\n\nThey are added to the allow-list (Config -> Who can join) and can join right away.")) {
    try {
      const al = await api("/api/allowlist");
      if (!al.names.some(n => n.toLowerCase() === name.toLowerCase())) al.names.push(name);
      await api("/api/allowlist", { json: { enabled: al.enabled, names: al.names } });
      toast(name + " can join now");
    } catch (e) { toast(e.message); }
  }
  show("config");
}

function switchServer(id) {
  SERVER = id; store.set("es-server", id);
  const u = new URL(location.href); u.searchParams.delete("srv"); history.replaceState(null, "", u.pathname + "#" + TAB);
  renderShell(); show(TAB === "servers" ? "overview" : TAB);
}

function authShell(inner) {
  $("#root").innerHTML = `<div class="center"><div class="card authcard"><div class="logo">${esc("B")}</div>${inner}</div></div>`;
}

function renderSetup() {
  if (!SESSION.setup_allowed) {
    return authShell(`<h1>Almost ready</h1><p class="sub">Open this dashboard once on the server computer itself (<span class="mono">http://localhost:${esc(location.port || 30815)}</span>) to create the password.</p>`);
  }
  authShell(`<h1>Create a password</h1><p class="sub">You'll use it to open the dashboard from any device.</p>
    <label class="f"><span>Password</span><input type="password" id="p1" autocomplete="new-password"><small>At least 8 characters. 12+ if you want internet access later.</small></label>
    <label class="f"><span>Repeat password</span><input type="password" id="p2" autocomplete="new-password"></label>
    <button class="btn primary" id="go">Create password</button>`);
  $("#go").onclick = async () => {
    if ($("#p1").value !== $("#p2").value) return toast("The passwords don't match");
    const b = $("#go"); if (b.disabled) return; b.disabled = true;   // no double submit
    try { await api("/api/setup", { json: { password: $("#p1").value } }); boot(); } catch (e) { b.disabled = false; toast(e.message); }
  };
}

function renderLogin(needCode) {
  needCode = needCode || SESSION.totp;
  authShell(`<h1>BeamMP Dashboard</h1><p class="sub">Log in to manage your server.</p>
    <form id="lf" autocomplete="on">
    <label class="f"><span>Password</span><input type="password" id="pw" autocomplete="current-password" autofocus></label>
    <label class="f ${needCode ? "" : "hidden"}" id="codebox"><span>Two-step code</span><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456"><small>From your authenticator app</small></label>
    <button class="btn primary" id="go" type="submit">Log in</button>
    <p class="small muted" id="err"></p></form>`);
  $("#lf").onsubmit = async ev => {
    ev.preventDefault();
    $("#go").disabled = true;
    try { await api("/api/login", { json: { password: $("#pw").value, code: $("#code").value } }); boot(); }
    catch (e) { $("#err").textContent = e.message; if (e.data && e.data.need_code) $("#codebox").classList.remove("hidden"); $("#go").disabled = false; }
  };
}

function renderShell() {
  const navs = TABS.map(([k, label]) => `<button class="nav" data-tab="${k}">${icon(k)}<span>${label}</span>${k === "notifications" ? '<span class="count hidden" data-unread></span>' : ""}</button>`).join("");
  const picker = SERVERS.length > 1 ? `<label class="srvpick"><span class="small muted">Server</span><select data-srv>${SERVERS.map(x => `<option value="${esc(x.id)}" ${x.id === SERVER ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>` : "";
  $("#root").innerHTML = `<div class="app">
    <aside class="side"><div class="brand"><div class="logo">B</div><div>BeamMP EasyServer<small>Dashboard ${esc(SESSION.version)}</small></div></div>
      ${picker}${navs}<div class="grow"></div>
      <div class="foot"><button class="iconbtn" id="theme" title="Light / dark mode">${icon("moon")}</button><span class="spacer"></span><button class="iconbtn" id="logout" title="Log out">${icon("logout")}</button></div>
    </aside>
    <div><nav class="mobilebar">${picker}${navs}<button class="nav" id="theme2">Theme</button></nav><div id="secbar"></div><main id="main"></main></div></div>`;
  document.querySelectorAll("[data-srv]").forEach(el => el.onchange = () => switchServer(el.value));
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => show(b.dataset.tab));
  const flip = () => { const cur = document.documentElement.dataset.theme; store.set("es-theme", cur === "dark" ? "light" : "dark"); applyTheme(); setThemeIcon(); if (TAB === "players") show("players"); };
  $("#theme").onclick = flip; $("#theme2").onclick = flip; setThemeIcon();
  $("#logout").onclick = async () => { try { await api("/api/logout", { method: "POST" }); } catch (e) {} clearInterval(SECTIMER); boot(); };
  clearInterval(SECTIMER); checkSecurity(); SECTIMER = setInterval(() => checkSecurity().catch(() => {}), 30000);
}

/* ------------------------------------------------------------------ security alerts */
let SECTIMER = null; const SEC_SEEN = new Set();
async function checkSecurity() {
  const bar = $("#secbar"); if (!bar) return;
  const d = await api("/api/security");
  const a = d.active || [];
  document.title = (a.length ? "⚠️ " : "") + "BeamMP Dashboard";
  if (!a.length) { bar.innerHTML = ""; return; }
  bar.innerHTML = `<div class="secbar" role="alert"><div style="flex:1"><b>⚠️ Security alert${a.length > 1 ? "s (" + a.length + ")" : ""}</b>
    ${a.slice(0, 3).map(x => `<div class="small"><b>${esc(x.title)}</b>${esc(x.count > 1 ? " · " + x.count + " times" : "")} · last ${esc(fmtTime(x.last))}</div>`).join("")}
    <div class="small">${d.reminders && d.enabled ? "Sent to all your notification channels and repeated every 15 minutes until you stop it." : "Details under Notifications."}</div></div>
    <button class="btn sm" id="secstop">Got it - stop alerts</button></div>`;
  $("#secstop").onclick = () => stopAlerts("all");
  // pop-up on this device (needs permission, given under Settings); clicking it stops the alert
  if (window.Notification && Notification.permission === "granted") {
    a.filter(x => !SEC_SEEN.has(x.id + ":" + x.sent)).forEach(x => {
      SEC_SEEN.add(x.id + ":" + x.sent);
      try { const n = new Notification("⚠️ " + x.title, { body: "Click to stop these alerts.", tag: x.id, requireInteraction: true }); n.onclick = () => { window.focus(); stopAlerts(x.id); n.close(); }; } catch (e) {}
    });
  }
}
async function stopAlerts(id) {
  try { const r = await api("/api/security/ack", { json: { id } }); toast(r.stopped ? "Alerts stopped - you won't get reminders for this any more" : "Already stopped"); } catch (e) { toast(e.message); }
  checkSecurity().catch(() => {});
}
function setThemeIcon() { const b = $("#theme"); if (b) b.innerHTML = icon(document.documentElement.dataset.theme === "dark" ? "sun" : "moon"); }

function show(tab) {
  TAB = tab; clearInterval(TIMER);
  history.replaceState(null, "", "#" + tab);
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  const m = $("#main"); m.innerHTML = `<p class="muted">Loading…</p>`;
  (VIEWS[tab] || VIEWS.overview)(m).catch(e => { if (e.message !== "Please log in") m.innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; });
  window.scrollTo(0, 0);
}
function setUnread(n) { document.querySelectorAll("[data-unread]").forEach(el => { el.textContent = n; el.classList.toggle("hidden", !n); }); }

/* ------------------------------------------------------------------ status helpers */
function statePill(state) {
  const map = { running: ["good", "Running"], stopped: ["", "Stopped"], failed: ["bad", "Crashed"], starting: ["warn", "Starting"], restarting: ["warn", "Restarting"], stopping: ["warn", "Stopping"] };
  const [cls, label] = map[state] || ["", state || "Unknown"];
  return `<span class="pill ${cls}"><span class="dot"></span>${esc(label)}</span>`;
}
async function serverAction(action, btn) {
  if (action !== "start" && !confirm(action === "stop" ? "Stop the server? Players will be disconnected." : "Restart the server? Players will be disconnected.")) return;
  if (btn) btn.disabled = true;
  try { await api("/api/server/action", { json: { action } }); toast(action === "stop" ? "Server stopped" : action === "start" ? "Server starting…" : "Server restarting…"); }
  catch (e) { toast(e.message); }
  setTimeout(() => show(TAB), 1500);
}

  if (s.state === "failed") banners.push(`<div class="banner bad"><b>The server crashed.</b><span class="muted">Check the Logs page for the reason.</span><span class="spacer"></span><button class="btn sm" data-go="logs">Open logs</button></div>`);

  m.innerHTML = `
    <div class="row"><div><h1>${esc(d.name || "BeamMP server")}</h1><p class="sub">${esc(d.lan_ip)}:${esc(d.port)} · ${esc(d.map || "?")} · ${d.private ? "Private" : "Public"}</p></div><span class="spacer"></span>${statePill(s.state)}</div>
    ${banners.join("")}
    <div class="grid g4">
      <div class="card stat"><div class="label">Players online</div><div class="value">${online.length}<span class="muted small"> / ${esc(d.max_players ?? "?")}</span></div><div class="note">${online.length ? esc(online.slice(0, 3).join(", ")) + (online.length > 3 ? "…" : "") : "Nobody right now"}</div></div>
      <div class="card stat"><div class="label">Uptime</div><div class="value">${s.state === "running" ? fmtDur(s.uptime) : "-"}</div><div class="note">${s.restarts ? esc(s.restarts) + " automatic restart(s)" : "No crashes"}</div></div>
      <div class="card stat"><div class="label">Mods</div><div class="value">${esc(d.mods)}</div><div class="note">${d.quarantined ? esc(d.quarantined) + " blocked" : "All virus-checked"}</div></div>
      <div class="card stat"><div class="label">BeamMP server</div><div class="value">${esc(d.installed_version || "?")}</div><div class="note">${d.update_available ? "Update available" : "Up to date"}</div></div>
    </div>
    <div class="grid g3" style="margin-top:16px">
      <div class="card"><h2>Server control</h2><p class="muted small">Start, stop or restart the BeamMP server. A restart disconnects everyone who is playing.</p>
        <div class="row">${s.state === "running" ? `<button class="btn" data-act="restart">Restart</button><button class="btn danger" data-act="stop">Stop</button>` : `<button class="btn primary" data-act="start">Start server</button>`}</div></div>
      <div class="card"><h2>Map</h2><p class="muted small">Switch the map in one click. The server restarts, so players are disconnected for a moment and reconnect on the new map.</p>
        <div class="row"><select id="qmap" style="flex:1;min-width:0">${[["Built-in maps", d.maps.builtin], ["Map mods", d.maps.mods]].filter(g => g[1].length).map(([l, xs]) => `<optgroup label="${l}">${xs.map(x => `<option ${x === d.map ? "selected" : ""}>${esc(x)}</option>`).join("")}</optgroup>`).join("")}${d.map && !d.maps.builtin.includes(d.map) && !d.maps.mods.includes(d.map) ? `<option selected>${esc(d.map)}</option>` : ""}</select><button class="btn primary" id="qmapgo">Apply</button></div></div>
      <div class="card"><h2>Who's online</h2>${online.length ? `<div class="row">${online.map(p => `<span class="pill"><span class="dot"></span>${esc(p)}</span>`).join("")}</div>` : `<p class="muted">Nobody is playing right now.</p>`}</div>
    </div>`;
  m.querySelectorAll("[data-act]").forEach(b => b.onclick = () => serverAction(b.dataset.act, b));
  m.querySelectorAll("[data-go]").forEach(b => b.onclick = () => show(b.dataset.go));
  $("#qmapgo").onclick = async () => {

    if (running && !confirm("Switch to " + mp + "?\n\nThe server restarts now" + (online.length ? " and " + online.length + " player(s) are disconnected for a moment" : "") + ".")) return;
    $("#qmapgo").disabled = true;
    try { const r = await api("/api/map", { json: { map: mp } }); toast(r.note, 6000); } catch (e) { toast(e.message); }
    setTimeout(() => show("overview"), 1500);
  };
  TIMER = setInterval(async () => { try { const x = await api("/api/overview"); if (x.status.state !== s.state || (x.online || []).length !== online.length || x.unread !== d.unread) show("overview"); } catch (e) {} }, 10000);
};

/* ---------------- servers */
VIEWS.servers = async m => {
  const d = await api("/api/servers");
  SERVERS = d.servers;
  const sys = d.system, win = d.platform === "windows";

  const fmtCpu = c => c == null ? "-" : c < 0.01 ? "0" : c.toFixed(2);
  const row = x => {
    const L = x.limits || {}, u = x.usage || {};
    const lim = [L.cpu_cores ? L.cpu_cores + (L.cpu_cores == 1 ? " core" : " cores") : "", L.ram_mb ? (L.ram_mb >= 1024 ? (L.ram_mb / 1024).toFixed(1) + " GB" : L.ram_mb + " MB") + " RAM" : "", L.upload_kbps ? (L.upload_kbps >= 1000 ? (L.upload_kbps / 1000).toFixed(1) + " Mbit/s" : L.upload_kbps + " kbit/s") + " mods" : ""].filter(Boolean).join(" · ") || "No limits";
    return `<div class="card" style="margin-top:12px"><div class="row"><div><h2 style="margin:0">${esc(x.name)}${x.id === SERVER ? ' <span class="badge">selected</span>' : ""}</h2>
        <p class="small muted" style="margin:4px 0 0">Port ${esc(x.port ?? "?")} · ${esc(x.map || "?")} · ${esc(x.online)}/${esc(x.max_players ?? "?")} players${x.has_authkey ? "" : " · no AuthKey"}</p></div>

      <div class="grid g3" style="margin-top:12px">

        <div class="stat"><div class="label">RAM now</div><div class="value" style="font-size:20px">${u.mem_mb == null ? "-" : esc(u.mem_mb)}<span class="muted small"> MB</span></div></div>

        <div class="lim">
          <label class="f"><span>CPU (cores)</span><input type="number" step="0.25" min="0" max="${esc(sys.cpu_cores)}" data-lc value="${esc(L.cpu_cores || 0)}"><small>e.g. 1.5 = one and a half cores</small></label>
          <label class="f"><span>RAM (MB)</span><input type="number" step="256" min="0" data-lr value="${esc(L.ram_mb || 0)}"><small>The server restarts if it uses more</small></label>

        </div>

      </div></div>`;
  };
  m.innerHTML = `<div class="row"><div><h1>Servers</h1><p class="sub">Run several BeamMP servers on this computer. Each has its own port, mods, config, allow-list and limits. The other pages show the server picked in the Server menu.</p></div></div>
    ${d.servers.map(row).join("")}
    <div class="card" style="margin-top:16px"><h2>Add a server</h2>
      <p class="small muted">The new server starts with your main server's settings and its own empty mods folder. Each server that should be public needs its own AuthKey from <span class="mono">keymaster.beammp.com</span>.</p>
      <div class="grid g2">

        <label class="f"><span>Port</span><input id="ns_port" type="number" min="1024" max="65535" value="${nextPort}"><small>Forward it (TCP + UDP) on your router for internet play</small></label>

        <label class="f"><span>Map</span><select id="ns_map">${["gridmap_v2","west_coast_usa","east_coast_usa","utah","italy","jungle_rock_island","industrial","small_island","automation_test_track","hirochi_raceway","johnson_valley","derby","driver_training"].map(x => `<option>${x}</option>`).join("")}</select></label>

/* ---------------- mods */
VIEWS.mods = async m => {
  const d = await api("/api/mods");
  const B = { clean: ["good", "✓ safe"], warning: ["warn", "⚠ check"], unchecked: ["", "not checked yet"] };
  m.innerHTML = `
    <h1>Mods</h1><p class="sub">Drop mod .zip files here. Every mod is virus-checked before players can download it.</p>
    <div class="drop" id="drop"><b>Drag &amp; drop mods here</b><br><span class="muted">or click to choose files</span><input id="file" type="file" accept=".zip" multiple hidden></div>
    <div id="uploads"></div>
    <p class="small muted" style="margin:10px 0 16px">🛡 Active checks: ${esc(d.checks.join(" + "))}. ${d.auto_apply ? "The server restarts by itself ~15 s after a change." : "Restart the server after changes."}</p>
    <div class="card tight"><table><thead><tr><th>Mod</th><th class="num">Size</th><th></th></tr></thead><tbody>
      ${d.mods.length ? d.mods.map(x => `<tr><td><b class="${x.enabled ? "" : "muted"}">${esc(x.name)}</b><span class="badge ${B[x.safety][0]}">${B[x.safety][1]}</span>${x.enabled ? "" : '<span class="badge">off</span>'}${x.maps.map(mp => `<span class="badge">map: ${esc(mp)}</span>`).join("")}
        ${x.reasons.length ? `<div class="small" style="color:var(--warn-ink);margin-top:4px">${x.reasons.map(esc).join("<br>")}</div>` : ""}</td>
        <td class="num muted">${fmtSize(x.size)}</td>
        <td class="num"><div class="row" style="justify-content:flex-end">${x.maps.length && x.enabled ? `<button class="btn sm" data-map="${esc(x.maps[0])}">Use map</button>` : ""}<button class="btn sm" data-a="toggle" data-n="${esc(x.name)}">${x.enabled ? "Turn off" : "Turn on"}</button><button class="btn sm danger" data-a="delete" data-n="${esc(x.name)}">Delete</button></div></td></tr>`).join("")
        : `<tr><td colspan="3" class="muted">No mods yet.</td></tr>`}
    </tbody></table></div>
    <div class="row" style="margin-top:12px"><button class="btn sm" id="rescan">Re-check all mods</button></div>
    ${d.quarantine.length ? `<h2 style="margin-top:26px">⛔ Blocked mods (quarantine)</h2><div class="card tight"><table><tbody>${d.quarantine.map(q => `<tr><td><b>${esc(q.name)}</b><div class="small" style="color:var(--crit-ink);white-space:pre-wrap">${esc(q.why)}</div></td><td class="num"><button class="btn sm danger" data-a="qdelete" data-n="${esc(q.name)}">Delete</button></td></tr>`).join("")}</tbody></table></div>` : ""}`;
  const D = $("#drop");
  D.onclick = () => $("#file").click();
  $("#file").onchange = e => upload([...e.target.files]);
  ["dragenter", "dragover"].forEach(t => D.addEventListener(t, e => { e.preventDefault(); D.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => D.addEventListener(t, e => { e.preventDefault(); D.classList.remove("over"); }));
  D.addEventListener("drop", e => upload([...e.dataTransfer.files]));
  m.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    if (b.dataset.a.includes("delete") && !confirm("Delete " + b.dataset.n + "?")) return;
    try { const r = await api("/api/mods/action", { json: { action: b.dataset.a, name: b.dataset.n } }); toast(r.note || "Done"); show("mods"); } catch (e) { toast(e.message); }
  });
  m.querySelectorAll("[data-map]").forEach(b => b.onclick = async () => {
    try {
      const cfg = await api("/api/config");
      const r = await api("/api/config/save", { json: { fields: [{ section: "General", key: "Map", value: b.dataset.map }] } });
      toast("Map set to " + b.dataset.map + ". " + r.note);
    } catch (e) { toast(e.message); }
  });
  $("#rescan").onclick = async () => { $("#rescan").disabled = true; toast("Checking all mods…"); try { const r = await api("/api/mods/rescan", { method: "POST" }); const bad = r.results.filter(x => x.verdict === "blocked").length; toast(bad ? bad + " mod(s) blocked" : "All mods passed"); } catch (e) { toast(e.message); } show("mods"); };
  async function upload(files) {
    for (const f of files) await one(f);
    show("mods");
  }
  function one(f) {
    return new Promise(res => {
      const box = document.createElement("div"); box.className = "card"; box.style.marginTop = "10px";
      box.innerHTML = `<b>${esc(f.name)}</b><div class="bar"><i></i></div><div class="small muted" data-s>Uploading…</div>`;
      $("#uploads").appendChild(box);
      if (!/\.zip$/i.test(f.name)) { box.querySelector("[data-s]").textContent = "Only .zip files"; return res(); }
      const x = new XMLHttpRequest();
      x.open("PUT", "/api/mods/upload?name=" + encodeURIComponent(f.name));
      x.setRequestHeader("X-ES-CSRF", CSRF); x.setRequestHeader("X-ES-Server", SERVER);
      x.upload.onprogress = e => { if (e.lengthComputable) box.querySelector("i").style.width = (e.loaded / e.total * 100) + "%"; };
      x.upload.onload = () => { box.querySelector("[data-s]").textContent = "Checking for viruses…"; };
      x.onload = () => {
        let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
        const s = box.querySelector("[data-s]");
        if (x.status === 422) { s.innerHTML = `<b style="color:var(--crit-ink)">Blocked - not uploaded.</b><br>${(j.reasons || []).map(esc).join("<br>")}`; }
        else if (x.status !== 200) { s.textContent = j.error || "Upload failed"; }
        else { s.innerHTML = `<span style="color:var(--good-ink)">✓ Uploaded and checked (${esc((j.checks || []).join(" + "))})</span>${j.maps && j.maps.length ? " · contains map " + esc(j.maps.join(", ")) : ""}${j.safety === "warning" ? `<div style="color:var(--warn-ink)">⚠ ${j.reasons.map(esc).join("<br>⚠ ")}</div>` : ""}`; }
        res();
      };
      x.onerror = () => { box.querySelector("[data-s]").textContent = "Upload failed"; res(); };
      x.send(f);
    });
  }
};

/* ---------------- players (analytics) */
function barChart(el, values, labels, tipFn, opts = {}) {
  const W = Math.max(280, Math.round(el.clientWidth || 640)), H = opts.h || 190, padL = 30, padB = 22, padT = 10;
  const max = Math.max(1, ...values), n = values.length;
  const step = (W - padL) / n, bw = Math.max(2, Math.min(28, step - 2));
  const nice = max <= 4 ? Math.ceil(max) : Math.ceil(max / 4) * 4;
  const y = v => padT + (H - padT - padB) * (1 - v / nice);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4; g += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/>`; }
  let ax = "";
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4; ax += `<text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${Number.isInteger(v) ? v : v.toFixed(1)}</text>`; }
  const every = Math.ceil(n / Math.max(3, Math.min(opts.labelsMax || 8, Math.floor((W - padL) / 52))));
  labels.forEach((l, i) => { if (i % every === 0) ax += `<text x="${padL + step * i + step / 2}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`; });
  let bars = "", hits = "";
  values.forEach((v, i) => {
    const x = padL + step * i + (step - bw) / 2, top = y(v), base = y(0), hh = Math.max(0, base - top);
    if (v > 0) { const r = Math.min(4, bw / 2, hh); bars += `<path data-i="${i}" d="M${x},${base}V${top + r}q0,-${r} ${r},-${r}h${bw - 2 * r}q${r},0 ${r},${r}V${base}Z"/>`; }
    hits += `<rect class="hit" data-i="${i}" x="${padL + step * i}" y="${padT}" width="${step}" height="${H - padT - padB}"/>`;
  });
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title || "chart")}"><g class="grid">${g}</g><g class="axis">${ax}</g><g class="bars">${bars.replace(/<path/g, '<path fill="var(--accent)"')}${hits}</g></svg><div class="tip hidden"></div></div>`;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  el.querySelectorAll("rect.hit").forEach(r => {
    r.addEventListener("mouseenter", () => {
      const i = +r.dataset.i; el.querySelectorAll("path[data-i]").forEach(p => p.style.opacity = +p.dataset.i === i ? 1 : .35);
      tip.innerHTML = tipFn(i); tip.classList.remove("hidden");
      const bb = svg.getBoundingClientRect(), sc = bb.width / W;
      tip.style.left = ((padL + step * i + step / 2) * sc) + "px"; tip.style.top = (y(values[i]) * sc) + "px";
    });
    r.addEventListener("mouseleave", () => { tip.classList.add("hidden"); el.querySelectorAll("path[data-i]").forEach(p => p.style.opacity = 1); });
  });
}

VIEWS.updates = async m => {
  const d = await api("/api/updates");
  const isNew = (a, b) => { if (!a || !b) return false; const x = a.split(".").map(Number), y = b.split(".").map(Number); for (let i = 0; i < 3; i++) { if (x[i] !== y[i]) return x[i] > y[i]; } return false; };
  const srvNew = isNew(d.latest, d.installed), esNew = isNew(d.easy_latest, d.easy_installed);
  m.innerHTML = `<div class="row"><div><h1>Updates</h1><p class="sub">${d.checked_at ? "Last checked " + esc(ago(d.checked_at)) : "Not checked yet"}. The dashboard checks every 6 hours and notifies you.</p></div><span class="spacer"></span><button class="btn" id="check">Check now</button></div>
    ${d.error ? `<div class="banner warn">${esc(d.error)}</div>` : ""}
    <div class="grid g2">
      <div class="card"><h2>BeamMP server</h2>
        <div class="row"><div class="stat"><div class="label">Installed</div><div class="value">${esc(d.installed || "?")}</div></div><span class="spacer"></span><div class="stat"><div class="label">Newest</div><div class="value">${esc(d.latest || "?")}</div></div></div>
        <p>${srvNew ? `<span class="pill warn"><span class="dot"></span>Update available</span>` : `<span class="pill good"><span class="dot"></span>Up to date</span>`}</p>
        ${srvNew ? `<p class="small muted">Installing stops the server for a moment (players are disconnected), then starts it again.</p><button class="btn primary" id="install">Install ${esc(d.latest)}</button>` : ""}
      </div>
      <div class="card"><h2>BeamMP EasyServer (this dashboard)</h2>
        <div class="row"><div class="stat"><div class="label">Installed</div><div class="value">${esc(d.easy_installed)}</div></div><span class="spacer"></span><div class="stat"><div class="label">Newest</div><div class="value">${esc(d.easy_latest || "?")}</div></div></div>
        <p>${esNew ? `<span class="pill warn"><span class="dot"></span>Update available</span>` : `<span class="pill good"><span class="dot"></span>Up to date</span>`}</p>
        ${esNew ? `<p class="small">Download it from <a href="https://github.com/${esc(d.repo)}/releases/latest" target="_blank" rel="noopener noreferrer">GitHub</a> and run the installer again - your settings and mods are kept.</p>` : ""}
      </div>
    </div>`;
  $("#check").onclick = async () => { $("#check").disabled = true; try { await api("/api/updates/check", { method: "POST" }); } catch (e) { toast(e.message); } show("updates"); };
  const ib = $("#install");

    ib.disabled = true; ib.textContent = "Installing…";
    try { const r = await api("/api/updates/install", { method: "POST" }); toast("Updated to " + (r.installed || "the newest version")); } catch (e) { toast(e.message); }
    show("updates");
  };
};

VIEWS.logs = async m => {

    box.innerHTML = d.lines.map(l => `<div class="${/\[ERROR\]/.test(l) ? "e" : /\[WARN\]/.test(l) ? "w" : ""}">${esc(l)}</div>`).join("") || `<span class="muted">The log is empty.</span>`;

    <div id="hints"></div><div class="log" id="log"></div>`;

  }
  $("#savenotif").onclick = () => saveNotif(false).catch(e => toast(e.message));
  ["security_alerts", "security_reminders"].forEach(k => $("#" + k).onchange = () => saveNotif(false).catch(e => toast(e.message)));
  const popNote = () => { $("#popupnote").textContent = !window.Notification ? (window.isSecureContext ? "This browser has no pop-ups" : "Pop-ups need HTTPS (turn it on below) or http://localhost") : Notification.permission === "granted" ? "On for this browser" : Notification.permission === "denied" ? "Blocked - allow notifications for this site in the browser settings" : ""; };
  popNote();
  $("#popups").onclick = async () => { if (window.Notification) { await Notification.requestPermission(); popNote(); if (Notification.permission === "granted") new Notification("BeamMP dashboard", { body: "Security alerts will pop up here while the dashboard is open." }); } else popNote(); };
  $("#savevt").onclick = async () => { const v = $("#vt").value.trim(); try { await api("/api/settings", { json: { vt_key: v === "off" ? "" : v } }); toast(v === "off" ? "VirusTotal turned off" : "Saved"); show("settings"); } catch (e) { toast(e.message); } };
  $("#savepw").onclick = async () => { try { await api("/api/password", { json: { current: $("#pw_cur").value, new: $("#pw_new").value } }); toast("Password changed"); $("#pw_cur").value = $("#pw_new").value = ""; } catch (e) { toast(e.message); } };
  const on = $("#tfaon");
  if (on) on.onclick = async () => {
    const r = await api("/api/2fa/begin", { method: "POST" });
    const n = Number(r.qr_size) || 0, qp = /^[MhvzZ0-9 -]*$/.test(r.qr_path || "") ? r.qr_path : "";
    const qr = n && qp ? `<div style="background:#fff;padding:12px;border-radius:8px;display:inline-block;margin:6px 0"><svg width="220" height="220" viewBox="-4 -4 ${n + 8} ${n + 8}" shape-rendering="crispEdges" role="img" aria-label="QR code for the two-step login key"><rect x="-4" y="-4" width="${n + 8}" height="${n + 8}" fill="#fff"/><path d="${qp}" fill="#000"/></svg></div>` : "";
    $("#twofa").innerHTML = `<p class="small">Scan this with your authenticator app (Google Authenticator, Microsoft Authenticator, Aegis...):</p>${qr}
      <p class="small muted">Can't scan? In the app choose <b>"Enter a setup key"</b>, account name <b>BeamMP</b>, and type this key:</p>
      <div class="secret">${esc(r.secret)}</div><p class="small muted">On a phone you can also <a href="${esc(r.uri)}">tap here</a> to add it directly. Clicking "Set up" again makes a new key - only the one shown here works.</p>
      <label class="f"><span>Enter the 6-digit code the app shows</span><input type="text" id="tfacode" inputmode="numeric" maxlength="7" style="max-width:180px"></label><button class="btn primary" id="tfaok">Turn on</button>`;
    $("#tfaok").onclick = async () => { try { await api("/api/2fa/confirm", { json: { code: $("#tfacode").value } }); toast("Two-step login is on"); show("settings"); } catch (e) { toast(e.message); } };
  };
  const off = $("#tfaoff");
  if (off) off.onclick = async () => { const p = prompt("Enter your password to turn off two-step login"); if (!p) return; try { await api("/api/2fa/disable", { json: { password: p } }); toast("Two-step login turned off"); show("settings"); } catch (e) { toast(e.message); } };
  $("#saveremote").onclick = async () => {
    const wantRemote = $("#remote_enabled").checked, wantHttps = $("#https").checked || wantRemote;
    const lines = [];
    if (wantRemote !== !!s.remote_enabled) lines.push(wantRemote
      ? "• Internet access ON: this computer's firewall opens port " + s.port + " (TCP) for the dashboard\n• Your router is NOT changed - forward port " + s.port + " there yourself"
      : "• Internet access OFF: this computer's firewall closes port " + s.port + " again");
    if (wantHttps !== !!s.https) lines.push("• The dashboard restarts on " + (wantHttps ? "https://" : "http://") + " - your browser reconnects by itself" + (wantHttps ? "\n• The first time, your browser warns about the self-made certificate" : ""));
    if (!lines.length) { toast("Nothing changed"); return; }
    if (!confirm("This changes your network settings:\n\n" + lines.join("\n") + "\n\nContinue?")) return;
    try {
      toast("Applying… (creating a certificate can take a few seconds)", 8000);
      const r = await api("/api/remote", { json: { https: $("#https").checked, remote_enabled: $("#remote_enabled").checked } });
      if (r.network) toast("🌐 " + r.network, 7000);
      if (r.restart) { setTimeout(() => toast("Restarting the dashboard - you'll be taken to the new address", 6000), r.network ? 1500 : 0); setTimeout(() => location.href = r.url.replace(/\/\/[^:/]+/, "//" + location.hostname), 4500); }
      else { toast("Saved"); show("settings"); }
    } catch (e) { toast(e.message); }
  };
  $("#imp").onclick = () => $("#impfile").click();
  $("#impfile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!confirm("Import " + f.name + "? Your current server config will be replaced (mods in the file are added and virus-checked).")) return;
    $("#impres").innerHTML = `<p class="muted">Importing…</p>`;
    const r = await fetch("/api/import", { method: "PUT", headers: { "X-ES-CSRF": CSRF, "X-ES-Server": SERVER }, body: f });
    let j = {}; try { j = await r.json(); } catch (x) {}
    if (!r.ok) { $("#impres").innerHTML = `<div class="banner bad">${esc(j.error || "Import failed")}</div>` + ((j.issues || []).map(i => `<div class="issue ${i.level}"><span class="ic">!</span><span>${esc(i.message)}</span></div>`).join("")); return; }
    const rep = j.report;
    $("#impres").innerHTML = `<div class="banner info"><span>✓ Imported. ${rep.mods_added.length} mod(s) added${rep.mods_blocked.length ? ", " + rep.mods_blocked.length + " blocked by the virus check" : ""}. ${esc(j.note)}</span></div>`;
  };
};

boot();
</script>
</body>
</html>
