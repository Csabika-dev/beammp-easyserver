# Creates ready-to-download ZIPs on the Releases page whenever you push a tag
# like v1.0.0  (GitHub page -> Releases -> "Draft a new release" -> new tag v1.0.0)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Linux scripts
        run: |
          bash -n linux/install.sh
          bash -n wake/install-wake-helper.sh
          python3 -m py_compile dashboard/*.py linux/control.py wake/easyserver_wake.py

      - name: Build ZIPs
        run: |
          mkdir -p dist
          chmod +x linux/install.sh "linux/Install BeamMP Server.desktop"
          cp README.md LICENSE windows/
          cp README.md LICENSE linux/
          cp -r dashboard windows/dashboard
          cp -r dashboard linux/dashboard
          (cd windows && zip -r ../dist/BeamMP-EasyServer-Windows.zip . -x '__pycache__/*')
          (cd linux && zip -r ../dist/BeamMP-EasyServer-Linux.zip . -x '__pycache__/*')
          chmod +x wake/install-wake-helper.sh
          cp LICENSE wake/
          (cd wake && zip -r ../dist/BeamMP-EasyServer-WakeHelper.zip . -x '__pycache__/*')

      - name: Release notes from CHANGELOG.md
        run: |
          # The section of CHANGELOG.md for this version ("## 1.12.0 - ..." up to the next "## ")
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md" > notes.md; fi
          printf '\n---\n**Downloads:** Windows → `BeamMP-EasyServer-Windows.zip` · Linux → `BeamMP-EasyServer-Linux.zip` (or the one-line install in the README) · Wake helper → `BeamMP-EasyServer-WakeHelper.zip`\n' >> notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: notes.md
