# Builds the Android phone app (android/) and attaches BeamMP-EasyServer.apk to every release.
# Optional, for smooth app updates: add the repository secrets ANDROID_KEYSTORE_B64 (a base64
# encoded .jks/.p12 keystore with the key alias "easyserver") and ANDROID_KEYSTORE_PASSWORD.
name: Android app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the project key."
          else
            echo "No signing secrets - using a one-off key (uninstall the old app before updating)."
          fi

      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ github.event.release.tag_name || 'dev' }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/BeamMP-EasyServer.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BeamMP-EasyServer-apk
          path: ${{ runner.temp }}/BeamMP-EasyServer.apk

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$RUNNER_TEMP/BeamMP-EasyServer.apk" --clobber --repo "${{ github.repository }}"
