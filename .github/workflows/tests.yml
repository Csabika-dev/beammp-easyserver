# Runs every test on every push and pull request. A red X on GitHub means something broke -
# open the run to see which test failed and why.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]      # oldest supported (Ubuntu 22.04) and newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Lua (BeamMP plugins use Lua 5.3)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3
      - name: Syntax checks
        run: |
          bash -n linux/install.sh
          bash -n wake/install-wake-helper.sh
          python -m py_compile dashboard/*.py linux/control.py wake/easyserver_wake.py
          luac5.3 -p dashboard/EasyServerStats/main.lua
      - name: Tests (dashboard, attacks, root helper, game plugin)
        run: python -m unittest discover -s tests -v

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1 windows, wake) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Signed-download check works
        shell: powershell
        run: |
          # The installer refuses unsigned downloads - make sure the check accepts a real signed Microsoft program
          $sig = Get-AuthenticodeSignature "$env:windir\System32\notepad.exe"
          Write-Host "notepad.exe: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { exit 1 }
      - name: Tests
        run: python -m unittest discover -s tests -v
